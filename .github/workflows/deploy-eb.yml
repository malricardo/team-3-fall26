name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - feature/eb-deploy
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
      EB_ENV_NAME: ${{ secrets.EB_ENV_NAME || 'nycfood-env' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Missing secret: AWS_ACCESS_KEY_ID"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Missing secret: AWS_SECRET_ACCESS_KEY"
            exit 1
          fi
          echo "Required AWS secrets are present."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Deploy to Elastic Beanstalk
        run: |
          mkdir -p ~/.aws
          printf '%s\n' \
            '[profile eb-cli]' \
            "region = ${AWS_REGION}" \
            'output = json' > ~/.aws/config
          printf '%s\n' \
            '[eb-cli]' \
            "aws_access_key_id = ${AWS_ACCESS_KEY_ID}" \
            "aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}" > ~/.aws/credentials
          test -f .elasticbeanstalk/config.yml
          eb deploy "${EB_ENV_NAME}" --region "${AWS_REGION}" --timeout 20
